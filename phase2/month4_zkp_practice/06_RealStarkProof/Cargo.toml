[package]
name = "real_stark_proof"
version = "0.1.0"
edition = "2021"

[dependencies]
# 🔥 진짜 STARK 라이브러리들 (간소화)
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# 간단한 머클 트리
rs_merkle = "1.4"

# 다항식 계산
num-bigint = "0.4"
num-traits = "0.2"

[[bin]]
name = "prover"
path = "src/prover.rs"

[[bin]]
name = "verifier"  
path = "src/verifier.rs"