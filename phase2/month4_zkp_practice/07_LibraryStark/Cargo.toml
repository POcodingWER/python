[package]
name = "library_stark"
version = "0.1.0"
edition = "2021"

[dependencies]
# 🔥 진짜 ZKP 라이브러리 (Plonk 기반)
ark-std = "0.4"
ark-ff = "0.4"
ark-poly = "0.4"
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["commitment"] }  # 진짜 암호학 프리미티브!
sha3 = "0.10"

# 기본 유틸리티
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"

[[bin]]
name = "prover"
path = "src/prover.rs"

[[bin]]
name = "verifier"
path = "src/verifier.rs"