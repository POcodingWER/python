[package]
name = "zkml_image_classifier"
version = "1.0.0"
edition = "2021"

[lib]
name = "zkml_classifier"
path = "src/lib.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "prove"
path = "src/bin/prove.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
# ZK Proof (08_HaloProof와 동일한 버전)
halo2_proofs = "0.3"
halo2curves = "0.6"
ff = "0.13"
group = "0.13"

# Web Server
actix-web = "4.0"
actix-cors = "0.7"
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Image Processing
image = "0.24"

# Utilities
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.11", features = ["blocking"] }
flate2 = "1.0"

