[package]
name = "zkml_sentiment"
version = "0.1.0"
edition = "2021"

[dependencies]
# ZK Proof
halo2_proofs = "0.3"
halo2curves = "0.6"
ff = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
sha2 = "0.10"

# Random
rand = "0.8"

# Web Server
actix-web = "4.4"
actix-cors = "0.7"
tokio = { version = "1.0", features = ["full"] }

# HTTP Client (for dataset download)
reqwest = { version = "0.11", features = ["blocking"] }
flate2 = "1.0"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "prove"
path = "src/bin/prove.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
