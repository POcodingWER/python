[package]
name = "arkworks_snark"
version = "1.0.0"
edition = "2021"

[lib]
name = "arkworks_snark"
path = "src/lib.rs"

# main.rs를 기본 바이너리로 사용

[dependencies]
# arkworks 핵심 라이브러리
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-relations = "0.4"

# 타원곡선들
ark-bn254 = "0.4"
ark-bls12-381 = "0.4"
ark-bls12-377 = "0.4"

# SNARK 프로토콜
ark-groth16 = "0.4"

# 유틸리티
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# 시간 측정
criterion = "0.5"

