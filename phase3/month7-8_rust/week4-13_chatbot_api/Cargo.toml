[package]
name = "week4-13_chatbot_api"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = "0.8.4"
candle-nn = "0.8.4"
candle-transformers = "0.8.4"
rand = "0.8.5"
actix-web = "4.4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
hf-hub = "0.3.2"
tokenizers = "0.15.0"
